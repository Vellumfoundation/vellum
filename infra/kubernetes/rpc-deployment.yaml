apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpc-gateway
  namespace: vellum
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rpc-gateway
  template:
    metadata:
      labels:
        app: rpc-gateway
    spec:
      containers:
        - name: rpc-gateway
          image: vellum/rpc-gateway:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
