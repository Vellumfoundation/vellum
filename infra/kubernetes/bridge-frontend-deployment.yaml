apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge-frontend
  namespace: vellum
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bridge-frontend
  template:
    metadata:
      labels:
        app: bridge-frontend
    spec:
      containers:
        - name: bridge-frontend
          image: vellum/bridge-frontend:latest
          ports:
            - containerPort: 3000
